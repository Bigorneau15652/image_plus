<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Content Security Policy: only this site and the Grist host may provide scripts.
    Pictures may come from any https address, because the drives that hold them differ.
    blob: lets the 360 degree viewer read a picture that the widget has already downloaded;
    connect-src https: lets the widget download a Grist attachment, or a 360 degree picture through
    the proxy the user typed in the settings, to give it to that viewer. The code only fetches those.
    If you use another Grist server, change the host below AND in the script tag.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://grist.numerique.gouv.fr; img-src 'self' data: blob: https:; connect-src blob: https:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Image Plus</title>
  <link rel="stylesheet" href="widget.css?v=0.7.0">
  <link rel="stylesheet" href="vendor/pannellum/pannellum.css?v=0.7.0">
  <script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"></script>
</head>
<body>
  <main id="app">
    <div id="notice" role="status" hidden></div>
    <p id="message"></p>

    <section id="viewer" hidden>
      <div id="stage">
        <div id="pano" hidden></div>
        <img id="photo" alt="" referrerpolicy="no-referrer" hidden>
        <p id="status"></p>
        <button type="button" id="prev" class="arrow" data-i18n-title="previousImage">&#8249;</button>
        <button type="button" id="next" class="arrow" data-i18n-title="nextImage">&#8250;</button>
        <span id="counter"></span>
      </div>
      <p id="error" role="alert" hidden></p>
      <p id="note360" hidden></p>
      <div id="bar">
        <div id="caption">
          <span id="name"></span>
          <span id="badge" class="badge-360" hidden></span>
        </div>
        <button type="button" id="floatButton" class="nav-button float-button" data-i18n-title="openFloat">&#8599;</button>
      </div>
    </section>

    <section id="floating" hidden>
      <p data-i18n="floatingNotice"></p>
      <button type="button" id="backButton" class="nav-button text-button" data-i18n="backToWidget"></button>
    </section>
  </main>

  <section id="settings" hidden>
    <h2 data-i18n="settingsTitle"></h2>
    <label class="check"><input type="checkbox" id="proxyEnabled"> <span data-i18n="settingsProxyEnable"></span></label>
    <label for="proxyUrl" data-i18n="settingsProxyUrl"></label>
    <input type="text" id="proxyUrl" autocomplete="off" spellcheck="false">
    <p class="help" data-i18n="settingsProxyHelp"></p>
    <p class="warning" data-i18n="settingsProxyWarning"></p>
    <p id="settingsError" role="alert" hidden></p>
    <div class="buttons">
      <button type="button" id="settingsSave" class="nav-button text-button" data-i18n="settingsSave"></button>
      <button type="button" id="settingsCancel" class="nav-button text-button secondary" data-i18n="settingsCancel"></button>
    </div>
  </section>

  <script src="shared/i18n.js?v=0.7.0"></script>
  <script src="images.js?v=0.7.0"></script>
  <script src="proxy.js?v=0.7.0"></script>
  <script src="item.js?v=0.7.0"></script>
  <script src="panorama.js?v=0.7.0"></script>
  <script src="vendor/pannellum/pannellum.js?v=0.7.0"></script>
  <script src="display.js?v=0.7.0"></script>
  <script src="drives.js?v=0.7.0"></script>
  <script src="widget.js?v=0.7.0"></script>
</body>
</html>
