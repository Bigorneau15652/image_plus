<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Floating window of Image Plus. Same strict policy as the widget page, without the Grist script
    and without downloads: the widget hands the pictures over (blob: or https address).
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; img-src 'self' data: blob: https:; connect-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Image Plus</title>
  <link rel="stylesheet" href="widget.css?v=0.7.0">
  <link rel="stylesheet" href="vendor/pannellum/pannellum.css?v=0.7.0">
</head>
<body>
  <main id="app">
    <p id="message"></p>

    <section id="viewer" hidden>
      <div id="stage">
        <div id="pano" hidden></div>
        <img id="photo" alt="" referrerpolicy="no-referrer" hidden>
        <p id="status"></p>
        <button type="button" id="prev" class="arrow" data-i18n-title="previousImage">&#8249;</button>
        <button type="button" id="next" class="arrow" data-i18n-title="nextImage">&#8250;</button>
        <span id="counter"></span>
      </div>
      <p id="error" role="alert" hidden></p>
      <p id="note360" hidden></p>
      <div id="bar">
        <div id="caption">
          <span id="name"></span>
          <span id="badge" class="badge-360" hidden></span>
        </div>
      </div>
    </section>
  </main>

  <script src="shared/i18n.js?v=0.7.0"></script>
  <script src="item.js?v=0.7.0"></script>
  <script src="panorama.js?v=0.7.0"></script>
  <script src="vendor/pannellum/pannellum.js?v=0.7.0"></script>
  <script src="display.js?v=0.7.0"></script>
  <script src="float.js?v=0.7.0"></script>
</body>
</html>
